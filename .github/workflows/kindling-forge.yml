# Kindling Forge — auto-generated. Do not edit manually.
# See: https://cattail-skittle-traverse.ngrok-free.dev/docs/feature/agent-factory
name: Kindling Forge

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Kindling agent_jobs.id'
        required: true
        type: string
      mode:
        description: 'Execution mode: build | scope | audit'
        required: false
        default: build
        type: choice
        options:
          - build
          - scope
          - audit

permissions:
  id-token: write   # Required for OIDC token generation
  contents: write   # Required to push branches
  pull-requests: write  # Required to open PRs

jobs:
  forge:
    name: Forge (${{ github.event.inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Kindling Forge
        uses: arunrao/otto/packages/forge-runner@forge-v1
        with:
          job_id: ${{ github.event.inputs.job_id }}
          kindling_url: https://cattail-skittle-traverse.ngrok-free.dev
          mode: ${{ github.event.inputs.mode }}
